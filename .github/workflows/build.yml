name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # لازم فقط لنشر Release عند وسم v*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المستودع يحوي ملفات المشروع فقط؛ setup.sh يولّد هيكل Flutter ويدمجها ويضبط minSdk=29
      - name: Generate Flutter project
        run: bash ./setup.sh "$RUNNER_TEMP/app"

      - name: Get packages
        run: cd "$RUNNER_TEMP/app" && flutter pub get

      - name: Analyze
        continue-on-error: true   # يظهر التحذير دون إيقاف بناء الـ APK
        run: cd "$RUNNER_TEMP/app" && flutter analyze --no-fatal-infos

      - name: Build release APK
        run: cd "$RUNNER_TEMP/app" && flutter build apk --release

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/app/build/app/outputs/flutter-apk/app-release.apk" dist/MSC-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MSC-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
