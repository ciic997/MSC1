name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate scaffold and overlay project files
        run: |
          flutter create --org com.example --project-name simdata --platforms android "$RUNNER_TEMP/app"
          rm -rf "$RUNNER_TEMP/app/test" "$RUNNER_TEMP/app/lib" "$RUNNER_TEMP/app/android/app/src/main/kotlin"
          cp -r lib assets pubspec.yaml "$RUNNER_TEMP/app/"
          cp -r android/app/src/main/. "$RUNNER_TEMP/app/android/app/src/main/"
          sed -i -E 's/minSdk(Version)?( =|) *flutter\.minSdkVersion/minSdk = 29/' "$RUNNER_TEMP"/app/android/app/build.gradle*

      - name: Get dependencies
        working-directory: ${{ runner.temp }}/app
        run: flutter pub get

      - name: Generate app icon from splash.jpg
        working-directory: ${{ runner.temp }}/app
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: ${{ runner.temp }}/app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MSC-apk
          path: ${{ runner.temp }}/app/build/app/outputs/flutter-apk/app-release.apk
